<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-VInancial - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 500px; margin: 40px auto; background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        h2 { color: #00ffaa; }
        .logout-btn { background: #ff4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #cc0000; }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        .add-btn { background: #00ffaa; color: #000; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        ul { list-style: none; }
        li { background: #2a2a2a; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        li.masuk { border-left: 4px solid #00ffaa; }
        li.keluar { border-left: 4px solid #ff5555; }
        .total { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 1.2rem; }
        .total span { color: #00ffaa; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h2>My-VInancial</h2>
                <p style="font-size: 0.9rem; color: #aaa;">Halo, <span id="user-name">User</span>!</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <div class="total">
            Saldo: <span id="balance">Rp 0</span>
        </div>

        <form id="transactionForm" class="form-group">
            <input type="text" id="desc" placeholder="Keterangan transaksi" required>
            <input type="number" id="amount" placeholder="Jumlah (Rp)" required>
            <select id="type">
                <option value="masuk">Pemasukan (+)</option>
                <option value="keluar">Pengeluaran (-)</option>
            </select>
            <button type="submit" class="add-btn">Tambah Transaksi</button>
        </form>

        <h3>Catatan Keuangan</h3>
        <ul id="transactionList" style="margin-top: 10px;"></ul>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-name').innerText = currentUser.username;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        const storageKey = 'transactions_' + currentUser?.username;
        let transactions = JSON.parse(localStorage.getItem(storageKey) || '[]');

        function updateUI() {
            const list = document.getElementById('transactionList');
            const balanceEl = document.getElementById('balance');
            list.innerHTML = '';
            let total = 0;

            transactions.forEach((t) => {
                const li = document.createElement('li');
                li.className = t.type;
                const val = t.type === 'masuk' ? t.amount : -t.amount;
                total += val;

                li.innerHTML = `
                    <span>${t.desc}</span>
                    <span>${t.type === 'masuk' ? '+' : '-'} Rp ${t.amount.toLocaleString('id-ID')}</span>
                `;
                list.appendChild(li);
            });

            balanceEl.innerText = 'Rp ' + total.toLocaleString('id-ID');
        }

        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            transactions.push({ desc, amount, type });
            localStorage.setItem(storageKey, JSON.stringify(transactions));

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            updateUI();
        });

        updateUI();
    </script>
</body>
</html>
