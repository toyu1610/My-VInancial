<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Vinancial - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <h1 class="login-title">My-Vinancial</h1>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>
        <p class="login-footer">
            Belum punya akun? <a href="#" onclick="alert('Fitur pendaftaran belum dibuka')">Daftar</a>
        </p>
    </div>

    <script src="script.js"></script>
    <script>
        // Redirect otomatis ke dashboard jika sudah dalam posisi logged in
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
